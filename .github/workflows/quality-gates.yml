name: Quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.impact.outputs.matrix }}
      has_shards: ${{ steps.impact.outputs.has_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: impact
        name: Validate and partition exact pull-request impact
        env:
          DETACH_QUALITY_AUTHORITY: ci-merge
        run: |
          BASE_SHA="$(git rev-parse HEAD^1)"
          plan="$RUNNER_TEMP/quality-impact.json"
          scripts/quality-shard plan --base "$BASE_SHA" >"$plan"
          python3 - "$plan" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          shards = value.get("shards")
          if not isinstance(shards, list):
              raise SystemExit("quality impact plan has invalid shards")
          level_zero = [shard for shard in shards if shard.get("id") == "static"]
          if len(level_zero) != 1 or level_zero[0].get("level") != 0:
              raise SystemExit("quality impact plan has no exact level-zero shard")
          later = [shard for shard in shards if shard.get("id") != "static"]
          matrix = json.dumps({"include": later}, separators=(",", ":"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
              output.write(f"has_shards={str(bool(later)).lower()}\n")
          PY
      - name: Run level-zero fail-fast contracts
        run: |
          BASE_SHA="$(git rev-parse HEAD^1)"
          scripts/quality-shard run --base "$BASE_SHA" --shard static --result-root app/build/quality-shards/static
      - name: Upload level-zero evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-shard-${{ github.run_id }}-${{ github.run_attempt }}-static
          path: app/build/quality-shards/static
          if-no-files-found: ignore
          retention-days: 14

  quality-shards:
    if: needs.quality-plan.result == 'success' && needs.quality-plan.outputs.has_shards == 'true'
    needs: quality-plan
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.quality-plan.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore last green main quality metrics
        if: matrix.needs_metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline --profile '${{ matrix.coverage_profile }}')"
          printf 'DETACH_QUALITY_BASELINE_ROOT=%s\n' "$baseline_root" >>"$GITHUB_ENV"
      - name: Restore exact packaged test app
        id: app-cache
        if: matrix.needs_app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/build/Detach.app
            app/.build/tmux-runtime/arm64/product
          key: detach-app-v2-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Resources/**/*', 'app/scripts/make-app.sh', 'app/scripts/bundle-modes.sh', 'app/scripts/verify-app.sh', 'bin/detach', 'bin/detach-core', 'scripts/install.sh', 'scripts/build-tmux.sh', 'VERSION', 'BUILD') }}
      - name: Restore exact executable quality products
        id: product-cache
        if: matrix.needs_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.build/quality-products-v1.json
            app/.build/quality-swift-tests/arm64-apple-macosx/debug/DetachAppPackageTests.xctest
            app/.build/quality-swift-tests/arm64-apple-macosx/debug/Sparkle.framework
            app/.build/quality-ui-release/arm64-apple-macosx/release/DetachApp
            app/.build/quality-ui-release/arm64-apple-macosx/release/Sparkle.framework
          key: detach-quality-products-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Tests/**/*.swift', 'app/Resources/DetachWatchdog-Info.plist', 'tools/quality_cache_warm.py', 'tools/quality_products.py', 'VERSION', 'BUILD') }}
      - name: Restore exact Swift and tmux inputs
        id: swift-cache
        if: (matrix.needs_cache && steps.product-cache.outputs.cache-hit != 'true') || (matrix.needs_app && steps.app-cache.outputs.cache-hit != 'true')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.build
          key: detach-swift-v3-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Tests/**/*.swift', 'app/Resources/DetachWatchdog-Info.plist', 'app/scripts/make-app.sh', 'scripts/build-tmux.sh', 'tools/quality_cache_warm.py', 'VERSION', 'BUILD') }}
          restore-keys: |
            detach-swift-v3-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Reuse exact cached Swift products
        if: steps.swift-cache.outputs.cache-hit == 'true'
        run: scripts/quality-cache-warm --reuse-exact-products
      - name: Materialize exact Swift dependencies
        if: steps.swift-cache.outcome == 'success'
        run: scripts/quality-cache-warm --dependencies-only
      - name: Verify and bind exact executable quality products
        if: matrix.needs_cache && steps.product-cache.outputs.cache-hit == 'true'
        run: |
          python3 tools/quality_products.py verify
          printf 'DETACH_QUALITY_EXACT_PRODUCTS=1\n' >>"$GITHUB_ENV"
      - name: Verify and bind exact packaged test app
        if: matrix.needs_app && steps.app-cache.outputs.cache-hit == 'true'
        run: |
          app/scripts/verify-app.sh
          printf 'DETACH_QUALITY_EXACT_APP=1\n' >>"$GITHUB_ENV"
      - name: Build and bind exact packaged test app
        if: matrix.needs_app && steps.app-cache.outputs.cache-hit != 'true'
        env:
          DETACH_QUALITY_APP_SCRATCH: 1
        run: |
          app/scripts/make-app.sh
          printf 'DETACH_QUALITY_EXACT_APP=1\n' >>"$GITHUB_ENV"
      - name: Run exact quality shard
        run: |
          BASE_SHA="$(git rev-parse HEAD^1)"
          scripts/quality-shard run --base "$BASE_SHA" --shard "${{ matrix.id }}" --result-root "app/build/quality-shards/${{ matrix.id }}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: app/build/quality-shards/${{ matrix.id }}
          if-no-files-found: ignore
          retention-days: 14

  quality-gates:
    if: always()
    needs:
      - quality-plan
      - quality-shards
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind event-to-verdict clock
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clock="$RUNNER_TEMP/quality-workflow-clock.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" >"$clock"
          started_at="$(python3 - "$clock" <<'PY'
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          started_at = value.get("created_at")
          if not isinstance(started_at, str) or not started_at:
              raise SystemExit("workflow clock has no created_at")
          print(started_at)
          PY
          )"
          printf 'DETACH_QUALITY_WORKFLOW_STARTED_AT=%s\n' "$started_at" >>"$GITHUB_ENV"
      - name: Download exact pull-request shard evidence
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/quality-shards
      - name: Aggregate authoritative pull-request evidence
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="$(git rev-parse HEAD^1)"
          scripts/quality-shard aggregate --base "$BASE_SHA" --input-root "$RUNNER_TEMP/quality-shards" --result-root app/build/quality-gates
      - id: promoted-main
        name: Promote exact pull-request evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error_log="$RUNNER_TEMP/quality-promotion-error.log"
          if promotion_root="$(scripts/quality-promote 2>"$error_log")"; then
            printf 'promoted=true\n' >>"$GITHUB_OUTPUT"
            printf 'root=%s\n' "$promotion_root" >>"$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            printf 'Promotion was unavailable; running the full main gate.\n' >&2
            printf 'promoted=false\n' >>"$GITHUB_OUTPUT"
          fi
      - name: Restore last green main quality metrics
        if: github.event_name != 'pull_request' && steps.promoted-main.outputs.promoted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          printf 'DETACH_QUALITY_BASELINE_ROOT=%s\n' "$baseline_root" >>"$GITHUB_ENV"
      - name: Restore exact packaged test app
        id: app-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/build/Detach.app
            app/.build/tmux-runtime/arm64/product
          key: detach-app-v2-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Resources/**/*', 'app/scripts/make-app.sh', 'app/scripts/bundle-modes.sh', 'app/scripts/verify-app.sh', 'bin/detach', 'bin/detach-core', 'scripts/install.sh', 'scripts/build-tmux.sh', 'VERSION', 'BUILD') }}
      - name: Restore exact executable quality products
        id: product-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.build/quality-products-v1.json
            app/.build/quality-swift-tests/arm64-apple-macosx/debug/DetachAppPackageTests.xctest
            app/.build/quality-swift-tests/arm64-apple-macosx/debug/Sparkle.framework
            app/.build/quality-ui-release/arm64-apple-macosx/release/DetachApp
            app/.build/quality-ui-release/arm64-apple-macosx/release/Sparkle.framework
          key: detach-quality-products-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Tests/**/*.swift', 'app/Resources/DetachWatchdog-Info.plist', 'tools/quality_cache_warm.py', 'tools/quality_products.py', 'VERSION', 'BUILD') }}
      - name: Restore Swift and tmux caches
        id: swift-cache
        if: github.event_name != 'pull_request' && (steps.product-cache.outputs.cache-hit != 'true' || steps.app-cache.outputs.cache-hit != 'true')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.build
          key: detach-swift-v3-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Tests/**/*.swift', 'app/Resources/DetachWatchdog-Info.plist', 'app/scripts/make-app.sh', 'scripts/build-tmux.sh', 'tools/quality_cache_warm.py', 'VERSION', 'BUILD') }}
          restore-keys: |
            detach-swift-v3-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Reuse exact cached Swift products
        if: github.event_name != 'pull_request' && steps.swift-cache.outputs.cache-hit == 'true'
        run: scripts/quality-cache-warm --reuse-exact-products
      - name: Verify and bind exact executable quality products
        if: github.event_name != 'pull_request' && steps.product-cache.outputs.cache-hit == 'true'
        run: |
          python3 tools/quality_products.py verify
          printf 'DETACH_QUALITY_EXACT_PRODUCTS=1\n' >>"$GITHUB_ENV"
      - name: Verify and bind exact packaged test app
        if: github.event_name != 'pull_request' && steps.app-cache.outputs.cache-hit == 'true'
        run: |
          app/scripts/verify-app.sh
          printf 'DETACH_QUALITY_EXACT_APP=1\n' >>"$GITHUB_ENV"
      - id: swift-warm
        name: Warm exact promoted-main Swift cache
        if: steps.promoted-main.outputs.promoted == 'true' && steps.swift-cache.outputs.cache-hit != 'true' && (steps.product-cache.outputs.cache-hit != 'true' || steps.app-cache.outputs.cache-hit != 'true')
        run: scripts/quality-cache-warm
      - id: app-warm
        name: Prepare exact promoted-main test app
        if: steps.promoted-main.outputs.promoted == 'true' && steps.swift-cache.outputs.cache-hit == 'true' && steps.app-cache.outputs.cache-hit != 'true'
        env:
          DETACH_QUALITY_APP_SCRATCH: 1
        run: app/scripts/make-app.sh
      - id: swift-dependencies
        name: Materialize exact Swift dependencies
        if: github.event_name != 'pull_request' && steps.swift-cache.outcome == 'success' && steps.promoted-main.outputs.promoted != 'true'
        run: scripts/quality-cache-warm --dependencies-only
      - id: main-gate
        name: Run main repository gate
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.promoted-main.outputs.promoted != 'true')
        env:
          DETACH_QUALITY_AUTHORITY: ci-main
        run: scripts/quality-gate --mode repository --keep-going
      - id: main-products
        name: Record completed main Swift products
        if: github.event_name != 'pull_request' && steps.swift-cache.outputs.cache-hit != 'true' && steps.promoted-main.outputs.promoted != 'true' && steps.main-gate.outcome == 'success'
        run: scripts/quality-cache-warm --record-product-inputs
      - id: product-warm
        name: Publish exact main executable products
        if: github.event_name != 'pull_request' && steps.product-cache.outputs.cache-hit != 'true' && ((steps.promoted-main.outputs.promoted == 'true' && (steps.swift-cache.outputs.cache-hit == 'true' || steps.swift-warm.outcome == 'success')) || (steps.promoted-main.outputs.promoted != 'true' && steps.main-gate.outcome == 'success'))
        run: python3 tools/quality_products.py publish
      - name: Save Swift and tmux caches
        if: always() && github.event_name != 'pull_request' && steps.swift-cache.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true' && ((steps.promoted-main.outputs.promoted == 'true' && steps.swift-warm.outcome == 'success') || (steps.promoted-main.outputs.promoted != 'true' && steps.main-products.outcome == 'success'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.build
          key: detach-swift-v3-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Tests/**/*.swift', 'app/Resources/DetachWatchdog-Info.plist', 'app/scripts/make-app.sh', 'scripts/build-tmux.sh', 'tools/quality_cache_warm.py', 'VERSION', 'BUILD') }}
      - name: Save exact packaged test app
        if: always() && github.event_name != 'pull_request' && steps.app-cache.outcome == 'success' && steps.app-cache.outputs.cache-hit != 'true' && ((steps.promoted-main.outputs.promoted == 'true' && (steps.swift-warm.outcome == 'success' || steps.app-warm.outcome == 'success')) || (steps.promoted-main.outputs.promoted != 'true' && steps.main-products.outcome == 'success'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/build/Detach.app
            app/.build/tmux-runtime/arm64/product
          key: detach-app-v2-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Resources/**/*', 'app/scripts/make-app.sh', 'app/scripts/bundle-modes.sh', 'app/scripts/verify-app.sh', 'bin/detach', 'bin/detach-core', 'scripts/install.sh', 'scripts/build-tmux.sh', 'VERSION', 'BUILD') }}
      - name: Save exact executable quality products
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.product-cache.outcome == 'success' && steps.product-cache.outputs.cache-hit != 'true' && steps.product-warm.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/.build/quality-products-v1.json
            app/.build/quality-swift-tests/arm64-apple-macosx/debug/DetachAppPackageTests.xctest
            app/.build/quality-swift-tests/arm64-apple-macosx/debug/Sparkle.framework
            app/.build/quality-ui-release/arm64-apple-macosx/release/DetachApp
            app/.build/quality-ui-release/arm64-apple-macosx/release/Sparkle.framework
          key: detach-quality-products-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.swift', 'app/Package.resolved', 'app/Sources/**/*.swift', 'app/Tests/**/*.swift', 'app/Resources/DetachWatchdog-Info.plist', 'tools/quality_cache_warm.py', 'tools/quality_products.py', 'VERSION', 'BUILD') }}
      - name: Publish gate summary
        if: always()
        shell: bash
        run: |
          runs=(app/build/quality-gates/*)
          if [ ! -f "${runs[0]}/summary.tsv" ]; then
            printf '## Quality gate\n\nNo evidence was produced.\n' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest="${runs[${#runs[@]}-1]}"
          {
            printf '## Quality gate evidence\n\n'
            if [ -f "$latest/promotion.md" ]; then
              cat "$latest/promotion.md"
              printf '\n'
            fi
            if [ -f "$latest/summary.md" ]; then
              cat "$latest/summary.md"
            else
              printf '```text\n'
              cat "$latest/manifest.tsv"
              printf '\n'
              cat "$latest/summary.tsv"
              printf '```\n'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-gates
          if-no-files-found: ignore
          retention-days: 14

  quality-dashboard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact main quality evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-gates
      - id: metrics-baseline
        name: Restore latest measured quality baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$(scripts/quality-baseline)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'root<<%s\n' "$delimiter"
            printf '%s\n' "$root"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: mutation-evidence
        name: Restore latest mutation score when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-mutation latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: care-evidence
        name: Restore latest quality-care summary when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-care latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: security-evidence
        name: Restore latest security result when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-security latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - name: Generate quality dashboard
        env:
          MUTATION_SUMMARY: ${{ steps.mutation-evidence.outputs.summary }}
          CARE_SUMMARY: ${{ steps.care-evidence.outputs.summary }}
          SECURITY_SUMMARY: ${{ steps.security-evidence.outputs.summary }}
          METRICS_BASELINE: ${{ steps.metrics-baseline.outputs.root }}
          DASHBOARD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mutation_args=()
          care_args=()
          security_args=()
          if [ -n "$MUTATION_SUMMARY" ]; then
            mutation_args+=(--mutation-summary "$MUTATION_SUMMARY")
          fi
          if [ -n "$CARE_SUMMARY" ]; then
            care_args+=(--care-summary "$CARE_SUMMARY")
          fi
          if [ -n "$SECURITY_SUMMARY" ]; then
            security_args+=(--security-summary "$SECURITY_SUMMARY")
          fi
          scripts/quality-dashboard generate \
            --result-root app/build/quality-gates \
            --output app/build/quality-dashboard \
            --run-url "$DASHBOARD_RUN_URL" \
            --metrics-baseline "$METRICS_BASELINE" \
            "${mutation_args[@]}" \
            "${care_args[@]}" \
            "${security_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
