name: Quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: promoted-main
        name: Promote exact pull-request evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error_log="$RUNNER_TEMP/quality-promotion-error.log"
          if promotion_root="$(scripts/quality-promote 2>"$error_log")"; then
            printf 'promoted=true\n' >>"$GITHUB_OUTPUT"
            printf 'root=%s\n' "$promotion_root" >>"$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            printf 'Promotion was unavailable; running the full main gate.\n' >&2
            printf 'promoted=false\n' >>"$GITHUB_OUTPUT"
          fi
      - name: Restore last green main quality metrics
        if: steps.promoted-main.outputs.promoted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          printf 'DETACH_QUALITY_BASELINE_ROOT=%s\n' "$baseline_root" >>"$GITHUB_ENV"
      - name: Restore Swift and tmux caches
        id: swift-cache
        if: steps.promoted-main.outputs.promoted != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/.build
          key: detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-${{ github.sha }}
          restore-keys: |
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Run authoritative pull-request gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DETACH_QUALITY_AUTHORITY: ci-merge
        run: scripts/quality-gate --mode repository --base "$BASE_SHA" --keep-going --without-release-budget
      - name: Run main repository gate
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.promoted-main.outputs.promoted != 'true')
        env:
          DETACH_QUALITY_AUTHORITY: ci-main
        run: scripts/quality-gate --mode repository --keep-going --without-release-budget
      - name: Save Swift and tmux caches
        if: always() && steps.promoted-main.outputs.promoted != 'true' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/.build
          key: detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-${{ github.sha }}
      - name: Publish gate summary
        if: always()
        shell: bash
        run: |
          runs=(app/build/quality-gates/*)
          if [ ! -f "${runs[0]}/summary.tsv" ]; then
            printf '## Quality gate\n\nNo evidence was produced.\n' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest="${runs[${#runs[@]}-1]}"
          {
            printf '## Quality gate evidence\n\n'
            if [ -f "$latest/promotion.md" ]; then
              cat "$latest/promotion.md"
              printf '\n'
            fi
            if [ -f "$latest/summary.md" ]; then
              cat "$latest/summary.md"
            else
              printf '```text\n'
              cat "$latest/manifest.tsv"
              printf '\n'
              cat "$latest/summary.tsv"
              printf '```\n'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-gates
          if-no-files-found: ignore
          retention-days: 14

  quality-dashboard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download exact main quality evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-gates
      - id: mutation-evidence
        name: Restore latest mutation score when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-mutation latest --optional)"
          printf 'summary=%s\n' "$summary" >>"$GITHUB_OUTPUT"
      - id: care-evidence
        name: Restore latest quality-care summary when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-care latest --optional)"
          printf 'summary=%s\n' "$summary" >>"$GITHUB_OUTPUT"
      - name: Generate quality dashboard
        run: |
          mutation_args=()
          care_args=()
          if [ -n "${{ steps.mutation-evidence.outputs.summary }}" ]; then
            mutation_args+=(--mutation-summary "${{ steps.mutation-evidence.outputs.summary }}")
          fi
          if [ -n "${{ steps.care-evidence.outputs.summary }}" ]; then
            care_args+=(--care-summary "${{ steps.care-evidence.outputs.summary }}")
          fi
          scripts/quality-dashboard generate \
            --result-root app/build/quality-gates \
            --output app/build/quality-dashboard \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${mutation_args[@]}" \
            "${care_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/quality-dashboard
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
