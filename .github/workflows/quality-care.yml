name: Quality care

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2,5"

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-care-${{ github.ref }}
  cancel-in-progress: true

jobs:
  care:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attention: ${{ steps.assess.outputs.attention }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Evaluate workflow corpus
        continue-on-error: true
        run: >-
          scripts/quality-care evaluate
          --output app/build/quality-care/evals.json
      - name: Collect recent bounded gate history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw="$RUNNER_TEMP/quality-care-raw"
          history="app/build/quality-care/history"
          since="$(date -u -d '13 days ago' +%Y-%m-%d)"
          mkdir -p "$raw" "$history"
          timeout 30s gh run list \
            --workflow quality-gates.yml \
            --branch main \
            --created ">=$since" \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId' >"$raw/run-ids"
          download_failures=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            if ! timeout 20s gh run download "$run_id" \
              --pattern 'quality-gate-evidence-*' \
              --dir "$raw/$run_id"; then
              download_failures=$((download_failures + 1))
            fi
          done <"$raw/run-ids"
          [ "$download_failures" -eq 0 ] || {
            printf 'quality-care: %s gate artifact downloads failed\n' "$download_failures" >&2
            exit 1
          }
          count=0
          while IFS= read -r manifest; do
            count=$((count + 1))
            cp -R "$(dirname "$manifest")" "$history/run-$count"
          done < <(find "$raw" -type f -name manifest.tsv | LC_ALL=C sort)
          [ "$count" -gt 0 ] || {
            printf 'quality-care: no gate evidence was downloaded\n' >&2
            exit 1
          }
          scripts/quality-history --format json "$history" \
            >app/build/quality-care/history.json
      - id: assess
        name: Assess eval and latency regressions
        if: always()
        run: |
          set +e
          scripts/quality-care assess \
            --eval-summary app/build/quality-care/evals.json \
            --history-summary app/build/quality-care/history.json \
            --output app/build/quality-care/summary.json
          status=$?
          set -e
          case "$status" in
            0) printf 'attention=false\n' >>"$GITHUB_OUTPUT" ;;
            1) printf 'attention=true\n' >>"$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Upload quality-care evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-care-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-care
          if-no-files-found: error
          retention-days: 30

  quality-dashboard:
    needs: care
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download current care evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-care-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-care
      - id: main-evidence
        name: Restore last green main quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'root<<%s\n' "$delimiter"
            printf '%s\n' "$baseline_root"
            printf '%s\n' "$delimiter"
            printf 'run_id<<%s\n' "$delimiter"
            printf '%s\n' "${baseline_root##*/}"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: mutation-evidence
        name: Restore latest mutation score when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-mutation latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: security-evidence
        name: Restore latest security result when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-security latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - name: Generate dashboard with care evidence
        env:
          MUTATION_SUMMARY: ${{ steps.mutation-evidence.outputs.summary }}
          SECURITY_SUMMARY: ${{ steps.security-evidence.outputs.summary }}
          MAIN_EVIDENCE_ROOT: ${{ steps.main-evidence.outputs.root }}
          DASHBOARD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ steps.main-evidence.outputs.run_id }}
        run: |
          mutation_args=()
          security_args=()
          if [ -n "$MUTATION_SUMMARY" ]; then
            mutation_args+=(--mutation-summary "$MUTATION_SUMMARY")
          fi
          if [ -n "$SECURITY_SUMMARY" ]; then
            security_args+=(--security-summary "$SECURITY_SUMMARY")
          fi
          scripts/quality-dashboard generate \
            --result-root "$MAIN_EVIDENCE_ROOT" \
            --output app/build/quality-dashboard \
            --care-summary app/build/quality-care/summary.json \
            --run-url "$DASHBOARD_RUN_URL" \
            "${mutation_args[@]}" \
            "${security_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/quality-dashboard
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  attention:
    if: always() && (needs.care.result == 'failure' || needs.care.outputs.attention == 'true')
    needs: care
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one bounded quality-care issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[quality-care] Scheduled control loop needs attention'
          existing="$(timeout 20s gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            timeout 20s gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The bounded quality-care workflow found an eval, evidence, or latency regression. Inspect $RUN_URL."
          fi

  enforce-attention:
    if: needs.care.outputs.attention == 'true'
    needs:
      - care
      - quality-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Keep attention visible in workflow status
        run: |
          printf 'quality-care: attention evidence was published and requires repair\n' >&2
          exit 1

  resolved:
    if: needs.care.result == 'success' && needs.care.outputs.attention == 'false'
    needs:
      - care
      - quality-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the resolved quality-care issue when it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[quality-care] Scheduled control loop needs attention'
          existing="$(timeout 20s gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            timeout 20s gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --comment 'The bounded quality-care control loop is healthy again.'
          fi
