name: Quality care

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2,5"

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-care-${{ github.ref }}
  cancel-in-progress: true

jobs:
  care:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attention: ${{ steps.assess.outputs.attention }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluate workflow corpus
        continue-on-error: true
        run: >-
          scripts/quality-care evaluate
          --output app/build/quality-care/evals.json
      - name: Collect recent bounded gate history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          raw="$RUNNER_TEMP/quality-care-raw"
          history="app/build/quality-care/history"
          since="$(date -u -d '13 days ago' +%Y-%m-%d)"
          mkdir -p "$raw" "$history"
          timeout 30s gh run list \
            --workflow quality-gates.yml \
            --branch main \
            --created ">=$since" \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId' >"$raw/run-ids"
          download_failures=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            if ! timeout 20s gh run download "$run_id" \
              --pattern 'quality-gate-evidence-*' \
              --dir "$raw/$run_id"; then
              download_failures=$((download_failures + 1))
            fi
          done <"$raw/run-ids"
          [ "$download_failures" -eq 0 ] || {
            printf 'quality-care: %s gate artifact downloads failed\n' "$download_failures" >&2
            exit 1
          }
          count=0
          while IFS= read -r manifest; do
            count=$((count + 1))
            cp -R "$(dirname "$manifest")" "$history/run-$count"
          done < <(find "$raw" -type f -name manifest.tsv | LC_ALL=C sort)
          [ "$count" -gt 0 ] || {
            printf 'quality-care: no gate evidence was downloaded\n' >&2
            exit 1
          }
          scripts/quality-history --format json "$history" \
            >app/build/quality-care/history.json
      - id: assess
        name: Assess eval and latency regressions
        if: always()
        run: |
          set +e
          scripts/quality-care assess \
            --eval-summary app/build/quality-care/evals.json \
            --history-summary app/build/quality-care/history.json \
            --output app/build/quality-care/summary.json
          status=$?
          set -e
          case "$status" in
            0) printf 'attention=false\n' >>"$GITHUB_OUTPUT" ;;
            1) printf 'attention=true\n' >>"$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Upload quality-care evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-care-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-care
          if-no-files-found: error
          retention-days: 30

  quality-dashboard:
    needs: care
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download current care evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-care-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-care
      - id: main-evidence
        name: Restore last green main quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          printf 'root=%s\n' "$baseline_root" >>"$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "${baseline_root##*/}" >>"$GITHUB_OUTPUT"
      - id: mutation-evidence
        name: Restore latest mutation score when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-mutation latest --optional)"
          printf 'summary=%s\n' "$summary" >>"$GITHUB_OUTPUT"
      - name: Generate dashboard with care evidence
        run: |
          mutation_args=()
          if [ -n "${{ steps.mutation-evidence.outputs.summary }}" ]; then
            mutation_args+=(--mutation-summary "${{ steps.mutation-evidence.outputs.summary }}")
          fi
          scripts/quality-dashboard generate \
            --result-root "${{ steps.main-evidence.outputs.root }}" \
            --output app/build/quality-dashboard \
            --care-summary app/build/quality-care/summary.json \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ steps.main-evidence.outputs.run_id }}" \
            "${mutation_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/build/quality-dashboard
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  attention:
    if: always() && (needs.care.result == 'failure' || needs.care.outputs.attention == 'true')
    needs: care
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one bounded quality-care issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[quality-care] Scheduled control loop needs attention'
          existing="$(timeout 20s gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            timeout 20s gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The bounded quality-care workflow found an eval, evidence, or latency regression. Inspect $RUN_URL."
          fi

  enforce-attention:
    if: needs.care.outputs.attention == 'true'
    needs:
      - care
      - quality-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Keep attention visible in workflow status
        run: |
          printf 'quality-care: attention evidence was published and requires repair\n' >&2
          exit 1

  resolved:
    if: needs.care.result == 'success' && needs.care.outputs.attention == 'false'
    needs:
      - care
      - quality-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the resolved quality-care issue when it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[quality-care] Scheduled control loop needs attention'
          existing="$(timeout 20s gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            timeout 20s gh issue close "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --comment 'The bounded quality-care control loop is healthy again.'
          fi
