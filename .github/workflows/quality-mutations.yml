name: Quality mutations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.mutation-corpus.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: mutation-corpus
        name: Validate deterministic corpus
        run: |
          scripts/quality-mutation validate
          printf 'matrix=%s\n' "$(scripts/quality-mutation matrix)" >>"$GITHUB_OUTPUT"

  mutation:
    needs: corpus
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.corpus.outputs.matrix) }}
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Swift cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/.build
          key: detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-${{ github.sha }}
          restore-keys: |
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Run bounded mutant
        run: >-
          scripts/quality-mutation run
          --id "${{ matrix.id }}"
          --output "app/build/quality-mutations/${{ matrix.id }}.json"
          --log "app/build/quality-mutations/${{ matrix.id }}.log"
      - name: Upload mutant evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-mutant-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-mutations
          if-no-files-found: error
          retention-days: 14

  score:
    if: always()
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download mutant evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: quality-mutant-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-mutations
          merge-multiple: true
      - name: Enforce mutation score
        run: >-
          scripts/quality-mutation summarize
          --results-root app/build/quality-mutations
          --output app/build/quality-mutations/summary.json
      - id: main-evidence
        name: Restore last green main quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          printf 'root=%s\n' "$baseline_root" >>"$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "${baseline_root##*/}" >>"$GITHUB_OUTPUT"
      - id: care-evidence
        name: Restore latest quality-care summary when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-care latest --optional)"
          printf 'summary=%s\n' "$summary" >>"$GITHUB_OUTPUT"
      - name: Generate dashboard with mutation score
        run: |
          care_args=()
          if [ -n "${{ steps.care-evidence.outputs.summary }}" ]; then
            care_args+=(--care-summary "${{ steps.care-evidence.outputs.summary }}")
          fi
          scripts/quality-dashboard generate \
            --result-root "${{ steps.main-evidence.outputs.root }}" \
            --output app/build/quality-dashboard \
            --mutation-summary app/build/quality-mutations/summary.json \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ steps.main-evidence.outputs.run_id }}" \
            "${care_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/build/quality-dashboard
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Publish mutation summary
        if: always()
        run: |
          printf '## Mutation quality\n\n```text\n' >>"$GITHUB_STEP_SUMMARY"
          if [ -f app/build/quality-mutations/summary.json ]; then
            scripts/quality-mutation summarize \
              --results-root app/build/quality-mutations \
              --output app/build/quality-mutations/summary.json \
              >>"$GITHUB_STEP_SUMMARY" 2>&1 || true
          else
            printf 'No complete score was produced.\n' >>"$GITHUB_STEP_SUMMARY"
          fi
          printf '```\n' >>"$GITHUB_STEP_SUMMARY"
      - name: Upload mutation score
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-mutation-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-mutations
          if-no-files-found: error
          retention-days: 30
