name: Quality mutations

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.mutation-corpus.outputs.matrix }}
      has_mutants: ${{ steps.mutation-corpus.outputs.has_mutants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: mutation-corpus
        name: Validate deterministic corpus
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          scripts/quality-mutation validate
          # A pull request runs only the mutants whose source or test suite
          # it changes; the merge commit's first parent is the base.
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD >"$RUNNER_TEMP/changed-files.txt"
            matrix="$(scripts/quality-mutation matrix --changed-files "$RUNNER_TEMP/changed-files.txt")"
          else
            matrix="$(scripts/quality-mutation matrix)"
          fi
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include": []}' ]; then
            printf 'has_mutants=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_mutants=true\n' >>"$GITHUB_OUTPUT"
          fi

  mutation:
    needs: corpus
    if: needs.corpus.outputs.has_mutants == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.corpus.outputs.matrix) }}
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Swift cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.build
          key: detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-${{ github.sha }}
          restore-keys: |
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Run bounded mutant
        run: >-
          scripts/quality-mutation run
          --id "${{ matrix.id }}"
          --output "app/build/quality-mutations/${{ matrix.id }}.json"
          --log "app/build/quality-mutations/${{ matrix.id }}.log"
      - name: Upload mutant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-mutant-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-mutations
          if-no-files-found: error
          retention-days: 14

  # One stable check for branch protection: the mutant matrix has dynamic job
  # names and is skipped when a pull request touches no mutant.
  mutation-gate:
    if: always() && github.event_name == 'pull_request'
    needs: [corpus, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected mutant to be killed
        env:
          CORPUS_RESULT: ${{ needs.corpus.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          [ "$CORPUS_RESULT" = success ] || {
            printf 'mutation corpus job: %s\n' "$CORPUS_RESULT" >&2
            exit 1
          }
          case "$MUTATION_RESULT" in
            success|skipped) printf 'mutation result: %s\n' "$MUTATION_RESULT" ;;
            *) printf 'mutation result: %s\n' "$MUTATION_RESULT" >&2; exit 1 ;;
          esac

  score:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download mutant evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-mutant-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-mutations
          merge-multiple: true
      - name: Enforce mutation score
        run: >-
          scripts/quality-mutation summarize
          --results-root app/build/quality-mutations
          --output app/build/quality-mutations/summary.json
      - id: main-evidence
        name: Restore last green main quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'root<<%s\n' "$delimiter"
            printf '%s\n' "$baseline_root"
            printf '%s\n' "$delimiter"
            printf 'run_id<<%s\n' "$delimiter"
            printf '%s\n' "${baseline_root##*/}"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: care-evidence
        name: Restore latest quality-care summary when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-care latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: security-evidence
        name: Restore latest security result when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-security latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - name: Generate dashboard with mutation score
        env:
          CARE_SUMMARY: ${{ steps.care-evidence.outputs.summary }}
          SECURITY_SUMMARY: ${{ steps.security-evidence.outputs.summary }}
          MAIN_EVIDENCE_ROOT: ${{ steps.main-evidence.outputs.root }}
          DASHBOARD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ steps.main-evidence.outputs.run_id }}
        run: |
          care_args=()
          security_args=()
          if [ -n "$CARE_SUMMARY" ]; then
            care_args+=(--care-summary "$CARE_SUMMARY")
          fi
          if [ -n "$SECURITY_SUMMARY" ]; then
            security_args+=(--security-summary "$SECURITY_SUMMARY")
          fi
          scripts/quality-dashboard generate \
            --result-root "$MAIN_EVIDENCE_ROOT" \
            --output app/build/quality-dashboard \
            --mutation-summary app/build/quality-mutations/summary.json \
            --run-url "$DASHBOARD_RUN_URL" \
            "${care_args[@]}" \
            "${security_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/quality-dashboard
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Publish mutation summary
        if: always()
        run: |
          printf '## Mutation quality\n\n```text\n' >>"$GITHUB_STEP_SUMMARY"
          if [ -f app/build/quality-mutations/summary.json ]; then
            scripts/quality-mutation summarize \
              --results-root app/build/quality-mutations \
              --output app/build/quality-mutations/summary.json \
              >>"$GITHUB_STEP_SUMMARY" 2>&1 || true
          else
            printf 'No complete score was produced.\n' >>"$GITHUB_STEP_SUMMARY"
          fi
          printf '```\n' >>"$GITHUB_STEP_SUMMARY"
      - name: Upload mutation score
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-mutation-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-mutations
          if-no-files-found: error
          retention-days: 30
