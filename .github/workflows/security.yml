name: Security analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize workflow analysis
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Analyze workflows
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:actions

  swift:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the Swift dependency graph
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.build
          key: detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-${{ github.sha }}
          restore-keys: |
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Resolve the locked Swift dependencies
        run: swift package --package-path app --force-resolved-versions resolve
      - name: Remove cached products before tracing
        run: swift package --package-path app clean
      - name: Initialize Swift analysis
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build all Swift products for analysis
        run: >-
          swift build
          --package-path app
          --arch arm64
          --jobs 3
          --disable-index-store
          --disable-sandbox
          --force-resolved-versions
          -Xswiftc -whole-module-optimization
          -Xswiftc -num-threads
          -Xswiftc 3
          -Xswiftc -gnone
      - name: Analyze Swift source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:swift

  security-evidence:
    if: always()
    needs:
      - actions
      - swift
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create exact security result
        run: >-
          scripts/quality-security create
          --source-commit "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --actions-result "${{ needs.actions.result }}"
          --swift-result "${{ needs.swift.result }}"
          --output app/build/quality-security/summary.json
      - name: Upload security result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-security
          if-no-files-found: error
          retention-days: 30
      - name: Enforce successful analysis
        run: >-
          scripts/quality-security validate
          app/build/quality-security/summary.json
          --require-pass

  quality-dashboard:
    if: always() && github.ref == 'refs/heads/main'
    needs: security-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download current security result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/quality-security
      - id: main-evidence
        name: Restore last green main quality evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_root="$(scripts/quality-baseline)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'root<<%s\n' "$delimiter"
            printf '%s\n' "$baseline_root"
            printf '%s\n' "$delimiter"
            printf 'run_id<<%s\n' "$delimiter"
            printf '%s\n' "${baseline_root##*/}"
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: mutation-evidence
        name: Restore latest mutation score when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-mutation latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - id: care-evidence
        name: Restore latest quality-care summary when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(scripts/quality-care latest --optional)"
          delimiter="detach-$(uuidgen)"
          {
            printf 'summary<<%s\n' "$delimiter"
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            fi
            printf '%s\n' "$delimiter"
          } >>"$GITHUB_OUTPUT"
      - name: Generate dashboard with security result
        env:
          MUTATION_SUMMARY: ${{ steps.mutation-evidence.outputs.summary }}
          CARE_SUMMARY: ${{ steps.care-evidence.outputs.summary }}
          MAIN_EVIDENCE_ROOT: ${{ steps.main-evidence.outputs.root }}
          DASHBOARD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ steps.main-evidence.outputs.run_id }}
        run: |
          mutation_args=()
          care_args=()
          if [ -n "$MUTATION_SUMMARY" ]; then
            mutation_args+=(--mutation-summary "$MUTATION_SUMMARY")
          fi
          if [ -n "$CARE_SUMMARY" ]; then
            care_args+=(--care-summary "$CARE_SUMMARY")
          fi
          scripts/quality-dashboard generate \
            --result-root "$MAIN_EVIDENCE_ROOT" \
            --output app/build/quality-dashboard \
            --security-summary app/build/quality-security/summary.json \
            --run-url "$DASHBOARD_RUN_URL" \
            "${mutation_args[@]}" \
            "${care_args[@]}"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/quality-dashboard
      - name: Deploy quality dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
